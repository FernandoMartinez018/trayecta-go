name: Android

on:
  pull_request:
    paths: ["app/**", "diseno/**", ".github/workflows/ci-android.yml"]
  push:
    branches: [main]
    paths: ["app/**", "diseno/**", ".github/workflows/ci-android.yml"]

permissions:
  contents: read

jobs:
  apk-pruebas:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: SDK de Android (plataforma 37 y build-tools 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Pruebas, lint y APK de pruebas
        run: ./gradlew :shared:testAndroidHostTest :androidApp:lintPruebasDebug :androidApp:assemblePruebasDebug --console=plain
        env:
          URL_API_PRUEBAS: ${{ vars.URL_API_PRUEBAS }}
          URL_AUTH_PRUEBAS: ${{ vars.URL_AUTH_PRUEBAS }}

      - uses: actions/upload-artifact@v7
        with:
          name: apk-pruebas
          path: app/androidApp/build/outputs/apk/pruebas/debug/*.apk
          if-no-files-found: error
