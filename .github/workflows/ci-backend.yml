name: Backend

on:
  pull_request:
    paths: ["backend/**", "contratos/**"]
  push:
    branches: [main]
    paths: ["backend/**", "contratos/**"]

permissions:
  contents: read
  packages: write

jobs:
  compilar-y-probar:
    # Se activa cuando la HU-0.2 cree el proyecto Gradle.
    if: ${{ hashFiles('backend/gradlew') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas
        run: ./gradlew test
      - name: Imagen de contenedor (solo main)
        if: github.ref == 'refs/heads/main'
        # La HU-0.2 define cómo se construye y publica la imagen multi-arquitectura en ghcr.io.
        run: echo "Pendiente HU-0.2"
