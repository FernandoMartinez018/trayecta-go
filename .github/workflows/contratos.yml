name: Contratos

on:
  pull_request:
    paths: ["contratos/**", ".github/workflows/contratos.yml"]
  push:
    branches: [main]
    paths: ["contratos/**", ".github/workflows/contratos.yml"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validar OpenAPI
        run: npx --yes @redocly/cli@1.25.11 lint contratos/openapi/v1.yaml
      - name: Validar AsyncAPI
        run: npx --yes @asyncapi/cli@2.3.0 validate contratos/asyncapi/v1.yaml
