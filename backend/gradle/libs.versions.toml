[versions]
kotlin = "2.4.21"
ktor = "3.6.0"
jib = "3.5.4"
hikari = "7.1.0"
postgresql = "42.7.14"
flyway = "13.10.3"
logback = "1.6.5"
logstash = "9.0"
# Fijada por encima de la transitiva de Ktor (4.6.0) por una corrección de seguridad.
javaJwt = "4.6.2"

[libraries]
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty" }
ktor-server-contentNegotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth" }
ktor-server-authJwt = { module = "io.ktor:ktor-server-auth-jwt" }
ktor-server-statusPages = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-callId = { module = "io.ktor:ktor-server-call-id" }
ktor-server-callLogging = { module = "io.ktor:ktor-server-call-logging" }
ktor-server-testHost = { module = "io.ktor:ktor-server-test-host" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "javaJwt" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
